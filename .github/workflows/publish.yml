name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

# Publishes are serialized. Two tags pushed seconds apart raced on 2026-10-21 and
# one version reported success without ever appearing on the registry.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::package.json version $version does not match tag $tag"
            exit 1
          fi

      - name: Validate skills
        run: |
          status=0
          for dir in skills/*/; do
            name="$(basename "$dir")"
            skill="${dir}SKILL.md"
            if [ ! -f "$skill" ]; then
              echo "::error file=$skill::$name has no SKILL.md"
              status=1
              continue
            fi
            for field in name description; do
              if ! awk -v f="$field" 'NR==1 && $0!="---" {exit} NR>1 && $0=="---" {exit} NR>1 && index($0, f ":")==1 {found=1} END {exit found?0:1}' "$skill"; then
                echo "::error file=$skill::missing frontmatter field '$field'"
                status=1
              fi
            done
          done
          exit "$status"

      # Allows the one-time manual bootstrap publish of a new package.
      - name: Check if the version is already published
        id: published
        run: |
          package="$(node -p "require('./package.json').name")"
          if npm view "${package}@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already-published != 'true'
        run: npm publish

      # The registry accepts a publish before its packument reflects it, and the
      # per-version document lags the packument by several minutes. A 2-minute
      # window went red on 2026-10-22 against a publish that had in fact
      # succeeded, so poll the packument for up to 10 minutes.
      - name: Verify the published version resolves
        if: steps.published.outputs.already-published != 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          package="$(node -p "require('./package.json').name")"
          url="https://registry.npmjs.org/${package/\//%2F}"
          for attempt in $(seq 1 20); do
            if curl -fsS "$url" 2>/dev/null \
              | VERSION="$version" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.exit(j.versions&&j.versions[process.env.VERSION]?0:1)}catch{process.exit(1)}})'; then
              echo "verified ${package}@${version} in the registry packument"
              exit 0
            fi
            echo "attempt ${attempt}: ${version} not in the packument yet, waiting"
            sleep 30
          done
          echo "::error::${package}@${version} published but never appeared in the registry packument"
          exit 1
